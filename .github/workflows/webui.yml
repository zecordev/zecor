name: webui
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["webui/**"]
  pull_request:
    paths: ["webui/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      # working-directory only applies to `run:` steps, not `uses:` -- point this one
      # at webui/package.json explicitly or it looks for packageManager at repo root
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
